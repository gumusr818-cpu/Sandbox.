<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Korku Şakası</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.hidden{
    display:none !important;
}

/* BAŞLANGIÇ */
#start{
    background:#111;
}

button{
    border:0;
    border-radius:14px;
    padding:16px 30px;
    font-size:20px;
    font-weight:bold;
    background:white;
    color:#111;
}

/* İZİN */
#permission{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

#permission p{
    max-width:330px;
    line-height:1.5;
    margin-bottom:20px;
}

/* KORKU EKRANI */
#scare{
    background:#000;
}

#monster{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;

    animation:
        shake 0.08s infinite,
        zoom 2s infinite alternate;
}

/* Küçük mavi çıkış noktası */
#stop{
    position:fixed;
    right:12px;
    top:12px;
    z-index:100;

    width:10px;
    height:10px;
    min-width:10px;
    min-height:10px;

    padding:0;
    margin:0;

    border-radius:50%;
    border:none;

    background:#168cff;
    box-shadow:0 0 8px #168cff;

    font-size:0;
}

@keyframes shake{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(4px,-2px);
    }

    50%{
        transform:translate(-4px,3px);
    }

    75%{
        transform:translate(3px,4px);
    }

    100%{
        transform:translate(-3px,-3px);
    }
}

@keyframes zoom{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.06);
    }
}
</style>
</head>

<body>

<!-- BAŞLA -->
<div id="start" class="screen">

    <button id="startBtn">
        BAŞLA
    </button>

</div>


<!-- İZİN -->
<div id="permission" class="screen hidden">

    <p>
        Bu eğlence uygulaması ekran efekti ve ses kullanmak istiyor.
    </p>

    <button id="allowBtn">
        İZİN VER
    </button>

</div>


<!-- KORKU EKRANI -->
<div id="scare" class="screen hidden">

    <!-- Buraya kendi görselinin adını yaz -->
    <img
        id="monster"
        src="1000155771.png"
        alt="Korku efekti"
    >

    <!-- Küçük mavi çıkış noktası -->
    <button
        id="stop"
        aria-label="Çıkış">
    </button>

</div>


<!-- SES -->
<audio
    id="music"
    loop
    preload="auto">

    <!-- HTML ile aynı klasöre korku.mp3 koy -->
    <source
        src="korku.mp3"
        type="audio/mpeg">

</audio>


<script>

const start =
    document.getElementById("start");

const permission =
    document.getElementById("permission");

const scare =
    document.getElementById("scare");

const music =
    document.getElementById("music");


/* BAŞLA */
document
.getElementById("startBtn")
.addEventListener("click", () => {

    start.classList.add("hidden");

    permission.classList.remove("hidden");

});


/* İZİN VER */
document
.getElementById("allowBtn")
.addEventListener("click", async () => {

    permission.classList.add("hidden");

    scare.classList.remove("hidden");


    /* SESİ BAŞLAT */
    try{

        music.currentTime = 0;

        music.volume = 1;

        await music.play();

    }catch(error){

        console.log(
            "Ses başlatılamadı:",
            error
        );

    }


    /* TAM EKRAN */
    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document
                .documentElement
                .requestFullscreen();

        }

    }catch(error){

        console.log(
            "Tam ekran açılamadı:",
            error
        );

    }

});


/* ÇIKIŞ */
document
.getElementById("stop")
.addEventListener("click", async () => {


    /* SESİ DURDUR */
    music.pause();

    music.currentTime = 0;


    /* TAM EKRANDAN ÇIK */
    try{

        if(
            document.fullscreenElement &&
            document.exitFullscreen
        ){

            await document.exitFullscreen();

        }

    }catch(error){

        console.log(error);

    }


    /* BAŞA DÖN */
    scare.classList.add("hidden");

    start.classList.remove("hidden");

});

</script>

</body>
  </html>
