let audioCtx=null, master=null, timer=null, running=false;

function startSound(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();
  master.gain.value=0.055;
  master.connect(audioCtx.destination);

  // Telifsiz, sentetik ve aralıksız korku ambiyansı.
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sawtooth";
  osc.frequency.value=48;
  gain.gain.value=0.35;
  osc.connect(gain); gain.connect(master); osc.start();

  const lfo=audioCtx.createOscillator();
  const lg=audioCtx.createGain();
  lfo.frequency.value=0.18;
  lg.gain.value=7;
  lfo.connect(lg); lg.connect(osc.frequency); lfo.start();

  timer=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(90+Math.random()*35,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(45,audioCtx.currentTime+1.8);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.11,audioCtx.currentTime+0.15);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+1.8);
    o.connect(g); g.connect(master); o.start(); o.stop(audioCtx.currentTime+1.9);
  },2200);
}

function stopSound(){
  if(timer) clearInterval(timer);
  timer=null;
  if(audioCtx) audioCtx.close();
  audioCtx=null; master=null;
}

document.getElementById("startBtn").onclick=()=>{
  document.getElementById("start").classList.add("hidden");
  document.getElementById("permission").classList.remove("hidden");
};

document.getElementById("allowBtn").onclick=async()=>{
  document.getElementById("permission").classList.add("hidden");
  document.getElementById("scare").classList.remove("hidden");
  running=true;
  startSound();
  if(document.documentElement.requestFullscreen){
    try{await document.documentElement.requestFullscreen()}catch(e){}
  }
  setInterval(()=>{
    if(!running) return;
    const f=document.getElementById("flash");
    f.style.opacity="0.06";
    setTimeout(()=>f.style.opacity="0",70);
  },900);
};

document.getElementById("stop").onclick=()=>{
  running=false;
  stopSound();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  document.getElementById("scare").classList.add("hidden");
  document.getElementById("start").classList.remove("hidden");
};
</script>
</body>
</html>
